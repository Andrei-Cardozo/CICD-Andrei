name: CI-CD Pipeline

on:
  push:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - run: pip install pytest

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3

      - run: pip install pytest

      - run: pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - run: echo "Deploy realizado com sucesso!"
